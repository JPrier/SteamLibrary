name: Sync Steam library
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      allow_large_removal:
        description: 'Approve an expected removal of 25 games or more than 10 percent'
        type: boolean
        default: false
  push:
    paths-ignore: ['data/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: steam-library-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=steam_sync --cov-report=term-missing --cov-fail-under=90
  sync:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Fetch and validate
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal }}
        shell: bash
        run: |
          args=()
          if [[ "$ALLOW_LARGE_REMOVAL" == "true" ]]; then
            args+=(--allow-large-removal)
          fi
          python -m steam_sync.sync "${args[@]}"
      - name: Commit meaningful changes
        shell: bash
        run: |
          git add data/steam-library.json data/steam-library-changes.json
          if git diff --cached --quiet; then
            echo 'Library unchanged; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Steam library snapshot'
          git push
